<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apuestas Fútbol</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 100px auto;
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header i {
            font-size: 3em;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--light);
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            font-size: 1.1em;
            cursor: pointer;
            color: #7f8c8d;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group label .required {
            color: #e74c3c;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--light);
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-group input.error {
            border-color: #e74c3c;
        }
        
        .form-group small {
            display: block;
            margin-top: 5px;
            font-size: 0.75em;
            color: #7f8c8d;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-login:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            min-height: 24px;
            font-size: 0.9em;
        }
        
        .success-message {
            color: #2ecc71;
            text-align: center;
            margin-top: 15px;
            min-height: 24px;
            font-size: 0.9em;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .info-fichas {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: var(--light);
            border-radius: 8px;
            color: var(--dark);
        }
        
        .info-fichas i {
            color: var(--warning);
            margin-right: 5px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
                /* ========================================== */
        /* ESTILOS RESPONSIVE PARA LOGIN - MÓVILES */
        /* ========================================== */
        
        @media (max-width: 768px) {
            body {
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .login-container {
                margin: 0 auto;
                padding: 25px 20px;
                width: 100%;
                max-width: 400px;
            }
            
            .login-header i {
                font-size: 2.5rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-header p {
                font-size: 0.8rem;
            }
            
            .tab-btn {
                padding: 12px;
                font-size: 0.9rem;
            }
            
            .form-group label {
                font-size: 0.85rem;
            }
            
            .form-group input {
                padding: 10px;
                font-size: 0.9rem;
            }
            
            .btn-login {
                padding: 12px;
                font-size: 1rem;
            }
            
            .info-fichas {
                padding: 12px;
                font-size: 0.8rem;
            }
            
            .info-fichas strong {
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .login-container {
                padding: 20px 15px;
            }
            
            .tabs {
                margin-bottom: 20px;
            }
            
            .tab-btn {
                padding: 10px;
                font-size: 0.85rem;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
            
            .form-group small {
                font-size: 0.65rem;
            }
            
            .info-fichas {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-futbol"></i>
            <h1>Fútbol Apuestas</h1>
            <p>Sistema de fichas virtuales</p>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="showTab('register')">Registrarse</button>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
            <div id="loginError" class="error-message"></div>
        </form>
        
        <!-- Register Form -->
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Cédula <span class="required">*</span></label>
                <input type="text" id="regCedula" placeholder="Ej: 30308452" required>
                <small>Tu número de cédula (será único y permanente)</small>
            </div>
            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" id="regNombre" placeholder="Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="regEmail" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="regTelefono" placeholder="0412-1234567">
                <small>Opcional</small>
            </div>
            <div class="form-group">
                <label>Contraseña <span class="required">*</span></label>
                <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="form-group">
                <label>Confirmar contraseña <span class="required">*</span></label>
                <input type="password" id="regConfirmPassword" placeholder="Repite la contraseña" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-user-plus"></i> Registrarse
            </button>
            <div id="registerError" class="error-message"></div>
            <div id="registerSuccess" class="success-message"></div>
        </form>
        
        <div class="info-fichas">
            <i class="fas fa-gift"></i>
            <strong>¡Bono de bienvenida!</strong><br>
            Recibirás <strong>1,000 fichas</strong> gratis al registrarte
        </div>
    </div>

    <script type="module">
        import { supabase, loginUser, registerUser, validateEmail, CONFIG } from './js/supabaseClient.js';

        window.showTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            document.getElementById('registerSuccess').textContent = '';
        };
        
        // Verificar si la cédula ya existe
        async function verificarCedulaExistente(cedula) {
            const { data, error } = await supabase
                .from('usuarios')
                .select('cedula')
                .eq('cedula', cedula)
                .maybeSingle();
            return !!data;
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const submitBtn = e.target.querySelector('button');
            
            if (!validateEmail(email)) {
                errorDiv.textContent = 'Email inválido';
                return;
            }
            
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Iniciando...';
            submitBtn.disabled = true;
            
            try {
                const result = await loginUser(email, password);
                if (result.success) {
                    window.location.href = result.user.rol === 'admin' ? 'admin.html' : 'dashboard.html';
                } else {
                    errorDiv.textContent = result.error;
                }
            } catch (error) {
                errorDiv.textContent = 'Error al iniciar sesión';
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
                submitBtn.disabled = false;
            }
        });

        // Registro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cedula = document.getElementById('regCedula').value.trim();
            const nombre = document.getElementById('regNombre').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const telefono = document.getElementById('regTelefono').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            const submitBtn = e.target.querySelector('button');
            
            errorDiv.textContent = '';
            successDiv.textContent = '';
            
            // Validaciones
            if (!cedula) {
                errorDiv.textContent = 'La cédula es obligatoria';
                return;
            }
            
            if (cedula.length < 4) {
                errorDiv.textContent = 'Cédula inválida';
                return;
            }
            
            if (!nombre) {
                errorDiv.textContent = 'El nombre es obligatorio';
                return;
            }
            
            if (!validateEmail(email)) {
                errorDiv.textContent = 'Email inválido';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Las contraseñas no coinciden';
                return;
            }
            
            // Verificar si la cédula ya existe
            const cedulaExiste = await verificarCedulaExistente(cedula);
            if (cedulaExiste) {
                errorDiv.textContent = `❌ La cédula ${cedula} ya está registrada`;
                return;
            }
            
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Registrando...';
            submitBtn.disabled = true;
            
            try {
                const result = await registerUser(email, password, nombre, cedula, telefono);
                
                if (result.success) {
                    successDiv.innerHTML = `✅ ¡Registro exitoso!<br>📋 Cédula: ${cedula}<br>💰 Recibiste ${CONFIG.FICHAS_INICIALES} fichas`;
                    
                    // Limpiar formulario
                    document.getElementById('regCedula').value = '';
                    document.getElementById('regNombre').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regTelefono').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regConfirmPassword').value = '';
                    
                    setTimeout(() => {
                        showTab('login');
                        document.getElementById('loginEmail').value = email;
                        successDiv.textContent = '';
                    }, 3000);
                } else {
                    errorDiv.textContent = result.error;
                }
            } catch (error) {
                errorDiv.textContent = error.message;
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Registrarse';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
